<script>
const W=1280,H=720,DUR=10,DW=1600,DH=900;

  g.strokeStyle=r.ch>=0?C.up:C.dn;g.lineWidth=1.6;g.beginPath();const mn=Math.min(...r.sp),mx=Math.max(...r.sp);r.sp.forEach((v,k)=>{const xx=w.x+410+k*3.9,y2=yy-2-((v-mn)/(mx-mn+1e-6))*20+6;k?g.lineTo(xx,y2):g.moveTo(xx,y2)});g.stroke();

}
// compute ATM row y once

// phone
const PH={x:800+68000,y:450-26000,w:1600,h:760};
function drawPhone(g,t){const {x,y,w,h}=PH;g.fillStyle='#000';rr(g,x-w/2,y-h/2,w,h,110);g.fill();g.strokeStyle='#2B3442';g.lineWidth=8;g.stroke();

// stars (world)
const STARS=[];{const r=mulberry(4242);for(let i=0;i<520;i++)STARS.push([800+(r()-0.5)*420000,450+(r()-0.5)*240000,r()*1.4+0.4,r()])}
// ---------- camera ----------
const PRICE=()=>[LASTX,py(live(0.0))];
const KEYS=[ // [tStart,tEnd,zoom,fx,fy]

 [0.85,2.55,0.78,800,452],
 [3.45,4.35,12,LASTX,py(BASE+0.55)-6],
 [4.65,5.6,2.3,ATM.x,ATM.y-40],
 [6.35,7.7,0.0032,800,450],

function camera(t){let z=KEYS[0][2],fx=KEYS[0][3],fy=KEYS[0][4];

// ---------- render ----------

    g.globalCompositeOperation='lighter';g.globalAlpha=sub*0.35;g.filter='blur(6px)';g.setTransform(SC*z,0,0,SC*z,SC*(W/2-fx*z),SC*(H/2-fy*z));g.drawImage(desk,0,0);g.filter='none';

  }
