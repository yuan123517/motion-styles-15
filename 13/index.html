function fitStage(){const s=Math.min(innerWidth/1280,innerHeight/720);document.getElementById('stage').style.transform='scale('+s+')';}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function startLoop(draw,fl=[]){fitStage();const P=document.fonts?Promise.all(fl.map(f=>document.fonts.load(f).catch(()=>0))).then(()=>document.fonts.ready):Promise.resolve();let done=false;const go=()=>{if(!done){done=true;_go(draw)}};P.then(go,go);setTimeout(go,2500);}
function _go(draw){const t0=performance.now();function f(now){const t=QT!==null?parseFloat(QT):((now-t0)/1000)%10;draw(t);if(QT===null)requestAnimationFrame(f);}if(QT!==null)f(0);else requestAnimationFrame(f);}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,ss=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)},eo=x=>1-Math.pow(1-clamp(x),3),eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};

const lc=document.getElementById('ledc'),lg=lc.getContext('2d');const glow=document.createElement('canvas');glow.width=1152;glow.height=472;const gg=glow.getContext('2d');

 const off=8*Math.exp(-k*6)+2.5;g.globalCompositeOperation='lighter';g.fillStyle=RED;g.fillText(txt,-off,0);g.fillStyle=BLU;g.fillText(txt,off,0);g.globalCompositeOperation='source-over';g.fillStyle='#fff';g.fillText(txt,0,0);g.restore();}
// tag

const tagg=document.getElementById('tagg');

const led=document.getElementById('led'),ledInner=document.getElementById('ledInner');
function draw(t){
 // shake

  for(let i=-14;i<=14;i++){g.strokeStyle='rgba(150,140,220,.06)';g.beginPath();g.moveTo(640+i*30,FY);g.lineTo(640+i*170,760);g.stroke();}
  g.save();g.filter='blur(5px)';g.font='italic 900 150px '+F;g.textAlign='center';g.fillStyle='rgba(255,255,255,.07)';g.setTransform(1,0,-.0,.32,shx,shy);g.fillText('ARENA',640,(FY+60)/.32);g.restore();

   const front=cs>0;g.fillStyle=front?RED:BLU;g.fillRect(-cr,-cr,cr,cr*2);g.fillStyle=front?BLU:RED;g.fillRect(0,-cr,cr,cr*2);

   g.lineWidth=6;g.strokeStyle='rgba(255,230,160,.9)';g.beginPath();g.ellipse(0,0,Math.max(.5,ww-8),cr-8,0,0,7);g.stroke();

  g.font='700 11px '+F;g.fillStyle='#9a9cab';g.letterSpacing='3px';g.fillText('R1 · BO3',SX-5,y-12+0);g.letterSpacing='0px';}

  // floor glow
