<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>08 · Film Tunnel — Every Frame Counts</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;flex:none;position:relative}canvas{display:block}</style></head>
<body><div id="wrap"><div id="stage"><canvas id="c" width="1280" height="720"></canvas></div></div>
<script>
const W=1280,H=720,DUR=10,F=900;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);document.getElementById('stage').style.transform=`scale(${s})`;
 const px=Math.round(W*Math.max(1,s*DPR)),py=Math.round(H*Math.max(1,s*DPR));if(cv.width!==px){cv.width=px;cv.height=py;off.width=px;off.height=py;acc.width=px;acc.height=py}}
const off=document.createElement('canvas'),acc=document.createElement('canvas');off.width=acc.width=W;off.height=acc.height=H;
const octx=off.getContext('2d'),actx=acc.getContext('2d');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,u)=>a+(b-a)*u,P=(t,a,b)=>cl((t-a)/(b-a));
const ss=u=>{u=cl(u);return u*u*(3-2*u)},eo=u=>1-Math.pow(1-cl(u),3),eio=u=>{u=cl(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(20260813);
const COLS=['#E8453C','#F28A30','#F2C230','#37A85A','#3478D6','#8A58D6'];
const TW=180,TH=120,TS=2; // tile supersample
// ---------- doodles ----------
const INK='#2B2440';
function doodle(g,k){g.save();g.strokeStyle=INK;g.fillStyle=INK;g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';const cx=90,cy=60;g.beginPath();
 const C=(x,y,r)=>{g.moveTo(x+r,y);g.arc(x,y,r,0,Math.PI*2)};
 switch(k){
 case 0: g.moveTo(40,86);g.lineTo(72,46);g.lineTo(92,70);g.lineTo(108,52);g.lineTo(140,86);C(122,40,9);break; // mountains+sun
 case 1: g.moveTo(90,84);g.bezierCurveTo(50,60,62,30,90,48);g.bezierCurveTo(118,30,130,60,90,84);break; // heart
 case 2: g.rect(56,46,68,40);g.moveTo(74,46);g.lineTo(80,38);g.lineTo(100,38);g.lineTo(106,46);C(90,66,13);C(90,66,6);g.rect(110,51,8,5);break; // camera
 case 3: g.moveTo(62,50);g.lineTo(66,86);g.lineTo(104,86);g.lineTo(108,50);g.closePath();g.moveTo(108,58);g.bezierCurveTo(124,58,124,76,105,76);g.moveTo(78,44);g.quadraticCurveTo(72,38,78,32);g.moveTo(92,44);g.quadraticCurveTo(86,38,92,32);break; // coffee
 case 4: g.moveTo(72,70);g.lineTo(76,90);g.lineTo(104,90);g.lineTo(108,70);g.closePath();g.moveTo(90,70);g.lineTo(90,46);g.moveTo(90,56);g.quadraticCurveTo(72,52,70,38);g.quadraticCurveTo(88,40,90,56);g.moveTo(90,50);g.quadraticCurveTo(106,46,110,32);g.quadraticCurveTo(94,34,90,50);break; // plant
 case 5: g.moveTo(66,88);g.quadraticCurveTo(62,58,74,52);g.lineTo(70,34);g.lineTo(84,46);g.lineTo(98,46);g.lineTo(110,34);g.lineTo(108,52);g.quadraticCurveTo(120,62,114,88);g.closePath();g.moveTo(114,84);g.quadraticCurveTo(136,82,130,60);C(82,62,2.5);C(102,62,2.5);break; // cat
 case 6: for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?12:28;const x=cx+Math.cos(a)*r,y=cy+4+Math.sin(a)*r;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();break; // star
 case 7: g.moveTo(90,30);g.quadraticCurveTo(108,46,104,76);g.lineTo(76,76);g.quadraticCurveTo(72,46,90,30);C(90,54,6);g.moveTo(76,66);g.lineTo(66,82);g.lineTo(77,78);g.moveTo(104,66);g.lineTo(114,82);g.lineTo(103,78);g.moveTo(84,80);g.lineTo(90,92);g.lineTo(96,80);break; // rocket
 case 8: C(90,52,18);g.moveTo(82,70);g.lineTo(82,80);g.lineTo(98,80);g.lineTo(98,70);g.moveTo(84,86);g.lineTo(96,86);g.moveTo(86,58);g.lineTo(90,50);g.lineTo(94,58);break; // bulb
 case 9: C(74,80,8);C(108,74,8);g.moveTo(82,80);g.lineTo(82,38);g.lineTo(116,32);g.lineTo(116,74);g.moveTo(82,46);g.lineTo(116,40);break; // notes
 case 10: g.moveTo(58,58);g.lineTo(90,32);g.lineTo(122,58);g.moveTo(66,52);g.lineTo(66,88);g.lineTo(114,88);g.lineTo(114,52);g.rect(84,66,12,22);g.rect(100,60,9,9);break; // house
 case 11: g.moveTo(90,90);g.lineTo(90,64);C(90,50,20);g.moveTo(80,62);g.quadraticCurveTo(76,52,84,46);break; // tree
 case 12: g.moveTo(62,62);g.bezierCurveTo(54,62,54,46,66,46);g.bezierCurveTo(68,30,92,28,98,42);g.bezierCurveTo(112,34,124,48,116,62);g.closePath();for(let i=0;i<4;i++){g.moveTo(68+i*14,72);g.lineTo(64+i*14,86)}break; // cloud rain
 case 13: C(64,76,14);C(116,76,14);g.moveTo(64,76);g.lineTo(82,52);g.lineTo(104,52);g.lineTo(116,76);g.moveTo(82,52);g.lineTo(92,76);g.lineTo(104,52);g.moveTo(78,46);g.lineTo(88,46);g.moveTo(104,52);g.lineTo(102,42);g.lineTo(110,42);break; // bike
 case 14: C(90,60,26);g.moveTo(76,66);g.quadraticCurveTo(90,80,104,66);C(80,52,1.5);C(100,52,1.5);break; // smiley
 case 15: g.rect(58,40,64,42);g.moveTo(58,40);g.lineTo(90,64);g.lineTo(122,40);break; // envelope
 }
 g.stroke();g.restore()}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function makeTile(col,dk,back){const c=document.createElement('canvas');c.width=TW*TS;c.height=TH*TS;const g=c.getContext('2d');g.scale(TS,TS);
 g.fillStyle=back?'#1A1830':col;g.fillRect(0,0,TW,TH);
 // sprocket bands
 g.fillStyle=back?'#0E0D1E':'rgba(20,16,40,.55)';g.fillRect(0,0,TW,17);g.fillRect(0,TH-17,TW,17);
 g.fillStyle=back?'#4A4766':'#FFFFFF';for(let i=0;i<9;i++){rr(g,6+i*20,5,10,7,2);g.fill();rr(g,6+i*20,TH-12,10,7,2);g.fill()}
 if(back){g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=2;g.strokeRect(12,23,TW-24,TH-46);return c}
 // frame
 g.fillStyle='rgba(255,250,238,.92)';rr(g,12,23,TW-24,TH-46,4);g.fill();
 g.strokeStyle=col;g.globalAlpha=.35;g.lineWidth=2;g.stroke();g.globalAlpha=1;
 if(dk>=0){g.save();g.translate(90,60);g.scale(.88,.88);g.translate(-90,-60+1);doodle(g,dk);g.restore();
   g.fillStyle=col;g.globalAlpha=.25;g.beginPath();g.arc(150,32,3,0,7);g.fill();g.globalAlpha=1}
 else{g.fillStyle=col;g.globalAlpha=.85;rr(g,12,23,TW-24,TH-46,4);g.fill();g.globalAlpha=1}
 return c}
const BLANK=COLS.map(c=>makeTile(c,-1,false)),BACK=COLS.map(c=>makeTile(c,0,true));
const TILES=COLS.map(c=>Array.from({length:16},(_,k)=>makeTile(c,k,false)));
// ---------- cells ----------
const NS=6,PER=16,STRIPW=PER*TW,RINGS=18,PERRING=12,SP=210,R=300;
const cells=[];
for(let s=0;s<NS;s++)for(let i=0;i<PER;i++){cells.push({s,i,col:s,dk:(s*5+i*3)%16,ap:0.5+rnd()*1.0,n:0})}
// order for tunnel flight: interleave
const order=cells.map((c,k)=>k).sort((a,b)=>{const A=cells[a],B=cells[b];return(A.i*NS+A.s)-(B.i*NS+B.s)});
order.forEach((k,n)=>cells[k].n=n);
const extra=[];for(let n=cells.length;n<RINGS*PERRING;n++)extra.push({n,col:n%6,dk:(n*7)%16,extra:true});
// ---------- 3D ----------
function proj(p,cam){const z=p[2]-cam.z;return[W/2+F*p[0]/z,H/2+F*p[1]/z,z]}
function rotZ(p,a){const c=Math.cos(a),s=Math.sin(a);return[p[0]*c-p[1]*s,p[0]*s+p[1]*c,p[2]]}
function rotY(p,a,cz){const c=Math.cos(a),s=Math.sin(a);const z=p[2]-cz;return[p[0]*c+z*s,p[1],-p[0]*s+z*c+cz]}
function stripX(c,t){const dir=c.s%2?-1:1;const slide=(1-eo(P(t,0+c.s*0.06,0.55+c.s*0.03)))*1500*(c.s%2?1:-1);
 const scroll=dir*t*38;let x=c.i*TW+scroll;x=((x%STRIPW)+STRIPW)%STRIPW-STRIPW/2+TW/2;return x+slide}
function ribbonCorners(c,t){
 const xc=stripX(c,t),yc=-300+60+c.s*120;
 const a=ss(P(t,2.0,3.1)),b=eio(P(t,2.0,4.2));
 const wave=a*48*Math.sin(xc*0.0055+t*2.6+c.s*0.9);
 const th=a*Math.PI*0.45*Math.sin(xc*0.0021-t*1.9+c.s*0.75);
 const dth=a*Math.PI*0.45*0.0021*Math.cos(xc*0.0021-t*1.9+c.s*0.75); // twist derivative for corner variation
 const zc=F+b*1100;const pts=[];
 for(const [du,dv] of [[-90,-60],[90,-60],[90,60],[-90,60]]){const th2=th+dth*du;const w2=a*48*Math.sin((xc+du)*0.0055+t*2.6+c.s*0.9);
  let p=[xc+du,yc+w2+dv*Math.cos(th2),zc+dv*Math.sin(th2)];
  p=rotZ(p,-0.21*b);p=rotY(p,0.32*b,zc);p[0]+=b*-120;pts.push(p)}
 return pts}
function tunnelCorners(n,t,cam){const r=Math.floor(n/PERRING),k=n%PERRING;const frac=k/PERRING;
 const L=RINGS*SP,near=140;let z=r*SP+frac*SP+700; // spiral
 let rel=z-cam.z;rel=((rel-near)%L+L)%L+near;z=rel+cam.z;
 const a=frac*Math.PI*2+r*0.35+t*0.28;const ca=Math.cos(a),sa=Math.sin(a);
 const C=[R*ca,R*sa,z],T=[-sa,ca,0];const pts=[];
 for(const [du,dv] of [[-90,-60],[90,-60],[90,60],[-90,60]])pts.push([C[0]-dv*T[0],C[1]-dv*T[1],C[2]+du]);
 return {pts,rel}}
function camZ(t){ // forward push then dash
 let z=0;z+=eio(P(t,4.0,5.8))*240;
 // dash 5.8-9.2: accel 5.8-6.6, cruise, decel 8.4-9.2
 const a=5.8,b=6.6,c=8.4,d=9.2,v=1900;
 const acc=(x)=>v*(x*x)/(2*(b-a));
 if(t>a){const u=Math.min(t,b)-a;z+=acc(u)}
 if(t>b){z+=v*(Math.min(t,c)-b)}
 if(t>c){const u=Math.min(t,d)-c;z+=v*(u-u*u/(2*(d-c)))}
 return z}
// affine-map tile onto triangle
function tri(g,img,s0,s1,s2,d0,d1,d2){
 const [x0,y0]=s0,[x1,y1]=s1,[x2,y2]=s2;const [u0,v0]=d0,[u1,v1]=d1,[u2,v2]=d2;
 const den=(x1-x0)*(y2-y0)-(x2-x0)*(y1-y0);if(Math.abs(den)<1e-6)return;
 const a=((u1-u0)*(y2-y0)-(u2-u0)*(y1-y0))/den,b=((v1-v0)*(y2-y0)-(v2-v0)*(y1-y0))/den;
 const c=((u2-u0)*(x1-x0)-(u1-u0)*(x2-x0))/den,d=((v2-v0)*(x1-x0)-(v1-v0)*(x2-x0))/den;
 const e=u0-a*x0-c*y0,f=v0-b*x0-d*y0;
 // expand clip slightly to hide seams
 const mx=(u0+u1+u2)/3,my=(v0+v1+v2)/3;const ex=(u,v)=>{const dx=u-mx,dy=v-my,l=Math.hypot(dx,dy)||1;return[u+dx/l*0.7,v+dy/l*0.7]};
 const A=ex(u0,v0),B=ex(u1,v1),Cc=ex(u2,v2);
 g.save();g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.lineTo(Cc[0],Cc[1]);g.closePath();g.clip();
 g.transform(a,b,c,d,e,f);g.drawImage(img,0,0,img.width,img.height,0,0,TW,TH);g.restore()}
function quad(g,img,P2){const S=[[0,0],[TW,0],[TW,TH],[0,TH]];tri(g,img,S[0],S[1],S[2],P2[0],P2[1],P2[2]);tri(g,img,S[0],S[2],S[3],P2[0],P2[2],P2[3])}
// bg cache
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;{const g=bgc.getContext('2d');const gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,760);gr.addColorStop(0,'#232460');gr.addColorStop(1,'#0D0E2C');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const r2=mulberry(7);for(let i=0;i<140;i++){g.fillStyle=`rgba(200,210,255,${0.15+r2()*0.35})`;g.beginPath();g.arc(r2()*W,r2()*H,r2()*1.3+0.3,0,7);g.fill()}}
function scene(g,t){
 g.drawImage(bgc,0,0);
 const cam={z:camZ(t)};const list=[];
 for(const c of cells){let pts;let alpha=1;
  const ts=4.0+(c.n/cells.length)*1.3,te=ts+0.75;
  if(t<ts)pts=ribbonCorners(c,Math.min(t,4.6));
  else{const tc=tunnelCorners(c.n,t,cam);if(t>=te)pts=tc.pts;else{const rb=ribbonCorners(c,Math.min(t,4.6));const k=eio(P(t,ts,te));
    // arc the flight a bit
    pts=rb.map((p,j)=>{const q=tc.pts[j];return[lerp(p[0],q[0],k),lerp(p[1],q[1],k)-Math.sin(k*Math.PI)*120,lerp(p[2],q[2],k)]})}}
  list.push({pts,c,alpha})}
 if(t>4.3){const fa=eo(P(t,4.3,5.6));for(const e of extra){const tc=tunnelCorners(e.n,t,cam);list.push({pts:tc.pts,c:e,alpha:fa})}}
 // project & sort
 const out=[];for(const it of list){let ok=true;const pp=it.pts.map(p=>{const q=proj(p,cam);if(q[2]<40)ok=false;return q});if(!ok)continue;
  const zavg=(pp[0][2]+pp[1][2]+pp[2][2]+pp[3][2])/4;out.push({pp,zavg,it})}
 out.sort((a,b)=>b.zavg-a.zavg);
 for(const o of out){const {pp,it}=o;const c=it.c;
  const fog=t>3.8?cl((o.zavg-900)/2600):0;const alpha=it.alpha*(1-fog*0.92);if(alpha<=0.01)continue;
  const area=(pp[1][0]-pp[0][0])*(pp[2][1]-pp[0][1])-(pp[2][0]-pp[0][0])*(pp[1][1]-pp[0][1]);
  const front=area>0;
  // cull offscreen
  const xs=pp.map(p=>p[0]),ys=pp.map(p=>p[1]);if(Math.max(...xs)<-20||Math.min(...xs)>W+20||Math.max(...ys)<-20||Math.min(...ys)>H+20)continue;
  g.globalAlpha=alpha;
  if(!front){quad(g,BACK[c.col],pp)}
  else{
   let img=TILES[c.col][c.dk];
   if(!c.extra&&t<c.ap+0.45){quad(g,BLANK[c.col],pp);const k=P(t,c.ap,c.ap+0.45);if(k>0){g.globalAlpha=alpha*ss(k);quad(g,img,pp)}}
   else quad(g,img,pp)}
 }
 g.globalAlpha=1;
}
function title(g,t){
 if(t<8.55)return;const k=P(t,8.55,9.15);const e=eo(k);const sc=lerp(1.12,1,e);const bl=(1-e)*10;
 g.save();g.translate(W/2,H/2-10);g.scale(sc,sc);g.globalAlpha=cl(k*2.2);
 g.font="900 112px 'Avenir Next Condensed','Barlow Condensed','Bebas Neue','Arial Narrow',sans-serif";g.textAlign='center';g.textBaseline='middle';
 if(bl>0.3)g.filter=`blur(${bl.toFixed(1)}px)`;
 g.shadowColor='rgba(140,190,255,.85)';g.shadowBlur=36;g.fillStyle='#fff';g.fillText('EVERY FRAME COUNTS.',0,0);g.shadowBlur=12;g.fillText('EVERY FRAME COUNTS.',0,0);
 g.restore();g.filter='none';
 // bars
 const bw=96,gap=10,x0=W/2-(6*bw+5*gap)/2;
 COLS.forEach((c,i)=>{const kk=eo(P(t,8.8+i*0.09,9.15+i*0.09));if(kk<=0)return;g.fillStyle=c;g.fillRect(x0+i*(bw+gap),H/2+70,bw*kk,10)});
}
function frame(t){
 const sx=cv.width/W;
 // darken behind title
 if(t>=5.8&&t<9.2){ // motion blur: 5 subframes averaged
  const sh=1/60;actx.setTransform(sx,0,0,sx,0,0);octx.setTransform(sx,0,0,sx,0,0);
  for(let k=0;k<5;k++){scene(octx,t+(k-2)*sh*0.3);actx.globalAlpha=1/(k+1);actx.drawImage(off,0,0,W,H)}
  actx.globalAlpha=1;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(acc,0,0)}
 else{ctx.setTransform(sx,0,0,sx,0,0);scene(ctx,t)}
 ctx.setTransform(sx,0,0,sx,0,0);
 if(t>8.4){const k=ss(P(t,8.4,9.0));const gr=ctx.createRadialGradient(W/2,H/2,60,W/2,H/2,560);gr.addColorStop(0,`rgba(13,14,44,${0.88*k})`);gr.addColorStop(1,'rgba(13,14,44,0)');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
 title(ctx,t);
 // loop fade
 const f=P(t,9.7,10);if(f>0){ctx.globalAlpha=ss(f);ctx.drawImage(bgc,0,0);ctx.globalAlpha=1}
 // start fade from bg
 if(t<0.15){ctx.globalAlpha=1-t/0.15;ctx.drawImage(bgc,0,0);ctx.globalAlpha=1}
}
addEventListener('resize',fit);fit();
const q=new URLSearchParams(location.search);const FT=q.has('t')?parseFloat(q.get('t')):null;let t0=null;
function loop(now){if(t0===null)t0=now;const t=FT!==null?FT:((now-t0)/1000)%DUR;frame(t);if(FT===null)requestAnimationFrame(loop)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
